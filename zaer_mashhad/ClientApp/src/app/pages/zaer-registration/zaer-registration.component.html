<div class="row">
  <div class="col-12 bg-white py-2 d-flex">
    <div class="d-flex w-100">
      <button class="btn text-info-custom d-flex" [routerLink]="['/trafic']">
        <i class="icon-fo-arrow-right-curved2 f-20 fw-bold ms-1"></i>
        بازگشت
      </button>

      <select
        class="form-control form-control-sm w-25 me-2"
        [(ngModel)]="zaer.caravanId"
      >
        <option *ngFor="let caravan of caravans" [value]="caravan.id">
          {{ caravan.name }} ({{ caravan.admin }})
        </option>
      </select>

      <input
        type="text"
        class="form-control form-control-sm me-2"
        style="width: 150px"
        [(ngModel)]="searchAny"
        placeholder="نام یا کد ملی"
      />

      <button class="btn btn-primary btn-sm me-2" (click)="getZaerList()">
        جستجو
      </button>

      <a [href]="'/print/0/' + zaer.caravanId" target="_blank">
        <button class="btn btn-success me-2"><i class="fa fa-print"></i></button
      ></a>
      <a [href]="'/print/1/' + zaer.caravanId" target="_blank">
        <button class="btn btn-info me-2 text-white">
          <i class="fa fa-print"></i></button
      ></a>
    </div>
    <div>
      <div *ngIf="loading" class="spinner-border text-primary"></div>
    </div>
  </div>
</div>
<input
  #imageUploader
  type="file"
  (change)="onFileSelected($event)"
  accept="image/*"
  class="d-none"
/>
<div class="row mt-4 mx-4" id="main-status">
  <div class="col-3">
    <div
      class="bg-white p-3 rounded-4 d-flex gap-3 flex-column align-items-center min-h-80"
    >
      <div class="w-100 text-center">
        <img
          src="{{ zaer.image || 'assets/img/no-img.jpg' }}"
          class="pointer zaer-image"
          (click)="imageUploader.click()"
        />
      </div>
      <div class="w-100">
        <input
          type="text"
          class="form-control w-100"
          #nationalCodeDom
          [(ngModel)]="zaer.nationalCode"
          placeholder="کد ملی"
        />
        <p class="very-small mb-0 me-2 text-warning-emphasis">
          کد ملی تکراری، رکورد را بروزرسانی میکند
        </p>
      </div>
      <div class="w-100">
        <input
          type="text"
          class="form-control w-100"
          [(ngModel)]="zaer.fullname"
          placeholder="نام و نام خانوادگی"
        />
      </div>
      <div class="w-100">
        <select class="form-control w-100" [(ngModel)]="zaer.sex">
          <option *ngFor="let sex of sexs" [value]="sex.id">
            {{ sex.name }}
          </option>
        </select>
      </div>
      <div class="w-100">
        <button
          class="btn btn-success w-100"
          [disabled]="!zaer.nationalCode || !zaer.fullname || !zaer.caravanId"
          (click)="saveZaer()"
        >
          ذخیره
        </button>
      </div>
    </div>
  </div>

  <div class="col-9">
    <div class="bg-white p-3 rounded-4 min-h-80">
      <table
        class="table table-hover table-bordered align-middle text-center w-100"
      >
        <thead class="table-light">
          <tr>
            <th style="width: 90px">
              <button
                class="btn btn-success btn-sm"
                (click)="exportExcel()"
                title="خروجی اکسل"
              >
                <i class="fa fa-file-excel-o"></i>
              </button>
            </th>

            <th>کد ملی</th>

            <th>نام و نام خانوادگی</th>

            <th style="width: 90px">جنسیت</th>

            <th style="width: 230px">عملیات</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let zaeritem of zaerList">
            <td class="align-middle">
              <img
                [src]="zaeritem.image || 'assets/img/no-img.jpg'"
                class="zaer-image-in-list rounded"
                loading="lazy"
              />
            </td>

            <td class="align-middle text-nowrap">
              {{ zaeritem.nationalCode }}
            </td>

            <td class="align-middle">
              {{ zaeritem.fullname }}
            </td>

            <td class="align-middle">
              {{ zaeritem.sex ? "آقا" : "خانم" }}
            </td>

            <td class="align-middle">
              <div class="btn-group ltr" role="group">
                <button
                  class="btn btn-warning btn-sm"
                  (click)="editZaer(zaeritem)"
                  title="ویرایش"
                >
                  <i class="fa fa-edit"></i>
                </button>

                <button
                  class="btn btn-danger btn-sm"
                  mwlConfirmationPopover
                  (confirm)="deleteZaer(zaeritem.nationalCode)"
                  title="حذف"
                >
                  <i class="fa fa-times"></i>
                </button>

                <a
                  [href]="'/print/0/' + zaer.caravanId + '/' + zaeritem.id"
                  target="_blank"
                  class="btn btn-success btn-sm"
                  title="چاپ"
                >
                  <i class="fa fa-print"></i>
                </a>

                <a
                  [href]="'/print/1/' + zaer.caravanId + '/' + zaeritem.id"
                  target="_blank"
                  class="btn btn-info btn-sm text-white"
                  title="چاپ"
                >
                  <i class="fa fa-print"></i>
                </a>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
